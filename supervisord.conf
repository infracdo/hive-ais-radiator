[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[program:radiator]
command=/opt/radiator/radiator/radiusd -config_file /etc/radiator/radiator.conf -foreground
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/radiator/radiator_error.log
stdout_logfile=/var/log/radiator/radiator_output.log
priority=1

[program:radiator-log-tail]
command=/usr/bin/tail -F /var/log/radiator/radiator.log /var/log/radiator/session_debug.log
autostart=true
autorestart=true
stderr_logfile=/dev/null
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=2
